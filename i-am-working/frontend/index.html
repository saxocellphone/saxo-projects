<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>I Am Working — open any URL as the app you want</title>
    <meta
      name="description"
      content="Paste a URL. Regenerate the site as Google Docs, technical documentation, or Outlook."
    />
    <link rel="stylesheet" href="/src/styles/app.css" />
    <link rel="stylesheet" href="/src/styles/shells/google-docs.css" />
    <link rel="stylesheet" href="/src/styles/shells/tech-docs.css" />
    <link rel="stylesheet" href="/src/styles/shells/outlook.css" />
  </head>
  <body>
    <div id="app">
      <header class="chrome" aria-label="I Am Working controls">
        <div class="chrome-row">
          <div class="brand" title="I Am Working">
            <span class="brand-mark" aria-hidden="true">◈</span>
            <span>I Am Working</span>
          </div>

          <div class="url-form">
            <input
              id="url-input"
              type="url"
              placeholder="Paste a URL (article, Reddit, HN…)"
              autocomplete="off"
              spellcheck="false"
            />
            <button type="button" id="btn-open" class="btn primary">Open</button>
          </div>

          <label class="visually-hidden" for="shell-select">Shell</label>
          <select id="shell-select" class="shell-select" title="Reading interface"></select>

          <button type="button" id="btn-original" class="btn" disabled>Open original</button>
          <button
            type="button"
            id="btn-hide-chrome"
            class="btn ghost"
            title="Hide top bar (press b to toggle)"
          >
            Hide bar
          </button>
          <span id="status">Ready</span>
        </div>

        <div class="chrome-row demo-row">
          <span class="demo-label">Try</span>
          <div id="demo-links"></div>
        </div>
      </header>

      <button
        type="button"
        id="btn-show-chrome"
        class="chrome-reveal"
        hidden
        title="Show top bar (press b to toggle)"
        aria-label="Show top bar"
      >
        ◈ Show bar
      </button>

      <main id="stage" aria-live="polite"></main>
    </div>

    <style>
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
